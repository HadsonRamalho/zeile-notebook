version: "3.8"

services:
  api:
    image: hadsonramalho/notebook-api:latest
    container_name: rust-server
    restart: always
    ports:
      - "3099:3099"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - APP_PORT=3099
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - RUST_LOG=${RUST_LOG}
      - FRONTEND_URL=${FRONTEND_URL}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./files:/app/files

  db:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
