[package]
name = "app"
version = "1.0.2"
description = "Zeile Notebook desktop shell (Tauri)"
authors = ["HadsonRamalho"]
license = "MIT"
repository = "https://github.com/HadsonRamalho/zeile-notebook"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1.20.0", features = ["v4"] }
tar = "0.4.46"
flate2 = "1.1.9"

[target."cfg(windows)".dependencies]
junction = "1"
