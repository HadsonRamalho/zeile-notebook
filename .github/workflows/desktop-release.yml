name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeile
          POSTGRES_PASSWORD: zeilepass
          POSTGRES_DB: zeile_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MIGRATION_DATABASE_URL: postgres://zeile:zeilepass@localhost:5432/zeile_migration_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar deps de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: cargo test --manifest-path rust-server/Cargo.toml
      - run: cargo check --workspace

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar deps de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Instalar NASM (Windows — build do openssl-sys/pq-sys)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
          NEXT_PUBLIC_API: ${{ vars.NEXT_PUBLIC_API }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Zeile Desktop ${{ inputs.tag || github.ref_name }}"
          releaseDraft: true
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
