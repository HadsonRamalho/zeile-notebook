name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm types:check

      - run: pnpm test

  rust-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zeile
          POSTGRES_PASSWORD: zeilepass
          POSTGRES_DB: zeile_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MIGRATION_DATABASE_URL: postgres://zeile:zeilepass@localhost:5432/zeile_migration_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: cargo fmt --all --check --manifest-path rust-server/Cargo.toml

      - run: cargo clippy --all-targets --manifest-path rust-server/Cargo.toml -- -D warnings

      - run: cargo test --manifest-path rust-server/Cargo.toml

      - run: cargo install diesel_cli --version 2.3.10 --no-default-features --features postgres --locked

      - run: bash scripts/check_schema.sh
        working-directory: rust-server
        env:
          SCHEMA_CHECK_DATABASE_URL: postgres://zeile:zeilepass@localhost:5432/zeile_migration_test
